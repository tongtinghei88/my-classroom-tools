<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coordinate Hunter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="toolbar">
      <div>
        <h1>Coordinate Hunter</h1>
        <p>Find the target coordinate on the grid.</p>
      </div>
      <div class="score">
        <span>Target: <strong id="target">(0, 0)</strong></span>
        <span>Score: <strong id="score">0</strong></span>
        <span>Time: <strong id="time">60</strong>s</span>
      </div>
      <button id="start">Start</button>
    </section>

    <section class="board-wrap">
      <div id="board" class="board" aria-label="coordinate grid"></div>
    </section>

    <section class="message" id="message">Press Start to play.</section>
  </main>

  <script src="script.js"></script>
</body>
</html>
